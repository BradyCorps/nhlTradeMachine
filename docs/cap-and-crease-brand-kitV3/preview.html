<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cap &amp; Crease V3 brand kit</title>
    <style>
      :root {
        --ink: #1c140a;
        --paper: #f2ecd7;
        --red: #b83020;
        --brass: #b8a070;
        --blue: #79afc1;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      main { width: min(1200px, calc(100% - 48px)); margin: 48px auto; }
      h1 { margin: 0 0 12px; font: 48px/1.1 Georgia, serif; }
      h2 { margin: 0 0 20px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
      section { padding: 32px 0; border-top: 1px solid var(--brass); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
      .panel { min-height: 260px; padding: 28px; border: 1px solid color-mix(in srgb, var(--brass), transparent 35%); display: grid; place-items: center; }
      .panel.dark { background: var(--ink); }
      .mark { width: min(220px, 75%); height: auto; }
      .mark-wide { width: min(360px, 92%); height: auto; }
      .lockup { width: 100%; height: auto; }
      .sizes { display: flex; align-items: end; flex-wrap: wrap; gap: 28px; }
      .size { display: grid; justify-items: center; gap: 8px; }
      .swatches { display: grid; grid-template-columns: repeat(5, 1fr); }
      .swatch { min-height: 120px; padding: 16px; display: flex; align-items: end; }
      .swatch:nth-child(1) { color: var(--paper); background: var(--ink); }
      .swatch:nth-child(2) { background: var(--paper); }
      .swatch:nth-child(3) { color: var(--paper); background: var(--red); }
      .swatch:nth-child(4) { background: var(--brass); }
      .swatch:nth-child(5) { background: var(--blue); }
    </style>
  </head>
  <body>
    <main>
      <h1>Cap &amp; Crease</h1>
      <p>Blue Paint identity · Brady-created centred V3 · production preview · v2.0</p>

      <section>
        <h2>Primary marks</h2>
        <div class="grid">
          <div class="panel"><img class="mark" src="assets/svg/cap-and-crease-mark-primary.svg" alt="Textured V3 primary mark" /></div>
          <div class="panel"><img class="mark" src="assets/svg/cap-and-crease-mark-primary-clean.svg" alt="Clean V3 mark" /></div>
          <div class="panel dark"><img class="mark" src="assets/svg/cap-and-crease-mark-reversed.svg" alt="Reversed mark" /></div>
          <div class="panel"><img class="mark" src="assets/svg/cap-and-crease-mark-one-color-ink.svg" alt="One-colour mark" /></div>
          <div class="panel"><img class="mark-wide" src="assets/svg/cap-and-crease-mark-tight-horizontal.svg" alt="Tight horizontal V3 mark" /></div>
        </div>
      </section>

      <section>
        <h2>Optical sizes</h2>
        <div class="sizes">
          <span class="size"><img src="assets/svg/cap-and-crease-mark-primary.svg" width="96" height="96" alt="" /><small>96px</small></span>
          <span class="size"><img src="assets/svg/cap-and-crease-mark-primary.svg" width="64" height="64" alt="" /><small>64px</small></span>
          <span class="size"><img src="assets/svg/cap-and-crease-mark-small.svg" width="32" height="32" alt="" /><small>32px</small></span>
          <span class="size"><img src="assets/svg/cap-and-crease-mark-small.svg" width="24" height="24" alt="" /><small>24px</small></span>
          <span class="size"><img src="assets/svg/cap-and-crease-mark-small.svg" width="16" height="16" alt="" /><small>16px</small></span>
        </div>
      </section>

      <section>
        <h2>Lockups</h2>
        <div class="grid">
          <div class="panel"><img class="lockup" src="assets/svg/cap-and-crease-lockup-horizontal.svg" alt="Horizontal lockup" /></div>
          <div class="panel"><img class="lockup" src="assets/svg/cap-and-crease-wordmark.svg" alt="Wordmark" /></div>
          <div class="panel"><img class="mark" src="assets/svg/cap-and-crease-seal.svg" alt="Publisher's seal" /></div>
        </div>
      </section>

      <section>
        <h2>Signature ampersand</h2>
        <div class="grid">
          <div class="panel"><img class="mark" src="assets/svg/cap-and-crease-ampersand.svg" alt="Signature red ampersand" /></div>
          <div class="panel"><img class="mark" src="assets/svg/cap-and-crease-ampersand-one-color-ink.svg" alt="Signature ampersand in warm black" /></div>
          <div class="panel dark"><img class="mark" src="assets/svg/cap-and-crease-ampersand-one-color-cream.svg" alt="Signature ampersand in cream" /></div>
        </div>
      </section>

      <section>
        <h2>Palette</h2>
        <div class="swatches">
          <div class="swatch">#1c140a</div>
          <div class="swatch">#f2ecd7</div>
          <div class="swatch">#b83020</div>
          <div class="swatch">#b8a070</div>
          <div class="swatch">#79afc1</div>
        </div>
      </section>
    </main>
  </body>
</html>
